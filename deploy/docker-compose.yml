# Puls — полный стек для самостоятельного сервера (Oracle Cloud и любой VPS).
# Запуск:  docker compose up -d --build
# Всё поднимается одной командой: база + приложение + nginx.

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Порт наружу НЕ пробрасываем — база доступна только приложению внутри сети.

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Приложение внутри контейнера слушает 8080 (start.sh).
      PORT: 8080
      # Подключение к базе внутри docker-сети (host = имя сервиса "db").
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      APP_ENV: production
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      # Сид-админ создаётся при первом старте (см. app/core/config.py).
      SEED_ADMIN_USERNAME: ${SEED_ADMIN_USERNAME:-admin}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
    expose:
      - "8080"     # виден только внутри docker-сети, наружу — через nginx

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      # - "443:443"   # раскомментировать после установки SSL (см. deploy/README-oracle.md)
    volumes:
      - ./nginx/puls.conf:/etc/nginx/conf.d/default.conf:ro
      # - ./nginx/certs:/etc/nginx/certs:ro   # для SSL-сертификатов

volumes:
  pgdata:
