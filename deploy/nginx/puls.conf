# Puls — nginx перед приложением. Проксирует всё на app:8080.
# HTTP-версия. Для HTTPS см. deploy/README-oracle.md (Certbot).

server {
    listen 80;
    server_name _;

    # Загрузка Excel и отчёты — поднимаем лимит тела запроса.
    client_max_body_size 25m;

    # Проксирование на приложение (имя сервиса "app" в docker-сети).
    location / {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Таймауты под возможные долгие операции (миграции/отчёты).
        proxy_connect_timeout 30s;
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;
    }
}
