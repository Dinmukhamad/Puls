name: checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: puls
          POSTGRES_PASSWORD: puls
          POSTGRES_DB: puls
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U puls -d puls"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints.txt -r requirements.txt -r requirements-dev.txt
      - name: Dependency audit
        run: pip-audit -r requirements.txt
      - name: PostgreSQL migration smoke test
        env:
          DATABASE_URL: postgresql://puls:puls@localhost:5432/puls
        run: |
          alembic upgrade head
          alembic current
      - name: Ruff
        run: ruff check app tests scripts
      - name: Compile Python
        run: python -m compileall app scripts tests
      - name: Pytest
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=69

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install Node dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Frontend tests
        run: npm test
      - name: Frontend dependency audit
        run: npm audit --audit-level=high
      # Бандлы js/app.js, js/api.js, css/styles.css закоммичены (их напрямую
      # отдаёт деплой: Dockerfile/railpack без Node). Этот шаг гарантирует,
      # что они пересобраны из js/src и css/src: если кто-то поменял исходники
      # и забыл `npm run build` (или отредактировал бандл руками) — CI упадёт.
      - name: Verify committed bundles match sources
        run: |
          CHANGED="$(git status --porcelain -- js/app.js js/api.js css/styles.css)"
          if [ -n "$CHANGED" ]; then
            echo "::error::Бандлы рассинхронизированы с исходниками js/src и css/src."
            git --no-pager diff --stat -- js/app.js js/api.js css/styles.css
            echo "Выполните локально 'npm run build' и закоммитьте обновлённые js/app.js, js/api.js, css/styles.css вместе с изменениями исходников."
            exit 1
          fi
          echo "Бандлы синхронны с исходниками."

  # Playwright гоняет поведение экранов в настоящем браузере: то, что юнит-
  # тесты на заглушках DOM не проверяют — открылась ли форма, пережил ли
  # ввод ошибку сервера, не ушёл ли второй запрос по второму клику.
  #
  # Пиксельные снимки (@visual) здесь исключены осознанно. Базлайны сняты
  # на windows, а сглаживание шрифтов в ubuntu другое: общий снимок либо
  # красил бы CI без причины, либо требовал бы такого допуска, при котором
  # уже ничего не ловит. Имя базлайна содержит платформу, поэтому линуксовые
  # снимки можно добавить рядом — заготовка ниже, job e2e-visual-baseline.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install Node dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: E2E (поведение, без пиксельных снимков)
        run: npm run test:e2e:ci
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            tests/e2e/.artifacts/
          retention-days: 7

  # Пиксельные снимки на linux. Job включается сам, как только в репозитории
  # появятся базлайны *-linux.png: до этого блокировать нечем, поэтому шаг
  # честно сообщает, что защиты пока нет, и не красит сборку.
  #
  # Базлайны снимает job e2e-visual-baseline ниже и приносит веткой на ревью:
  # снимок эталона — решение человека, автоматически в main он не попадает.
  e2e-visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Есть ли базлайны для linux
        id: baselines
        run: |
          if compgen -G "tests/e2e/__screenshots__/*-linux.png" > /dev/null; then
            echo "have=true" >> "$GITHUB_OUTPUT"
          else
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Базлайнов *-linux.png нет — визуальные регрессии в CI пока не ловятся. Снимите их вручную: Actions → checks → Run workflow (job e2e-visual-baseline)."
          fi
      - uses: actions/setup-node@v4
        if: steps.baselines.outputs.have == 'true'
        with:
          node-version: "22"
          cache: npm
      - if: steps.baselines.outputs.have == 'true'
        run: npm ci
      - if: steps.baselines.outputs.have == 'true'
        run: npm run build
      - if: steps.baselines.outputs.have == 'true'
        run: npx playwright install --with-deps chromium
      - name: Визуальные снимки
        if: steps.baselines.outputs.have == 'true'
        run: npx playwright test --grep @visual
      - name: Upload diff
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diff
          path: |
            playwright-report/
            tests/e2e/.artifacts/
          retention-days: 7

  # Запускается только вручную. Снимает линуксовые базлайны и приносит их
  # веткой ci/linux-visual-baselines: картинки видно в диффе, и человек сам
  # решает, эталон это или зафиксированная регрессия. В main ничего не
  # попадает автоматически — сразу после мержа ветки job e2e-visual выше
  # включается сам и начинает блокировать визуальные регрессии.
  e2e-visual-baseline:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Снять базлайны для linux
        run: npx playwright test --grep @visual --update-snapshots
      - uses: actions/upload-artifact@v4
        with:
          name: linux-screenshots
          path: tests/e2e/__screenshots__/*-linux.png
          retention-days: 14
      - name: Принести базлайны отдельной веткой
        env:
          BRANCH: ci/linux-visual-baselines
        run: |
          if [ -z "$(git status --porcelain -- tests/e2e/__screenshots__)" ]; then
            echo "::notice::Базлайны не изменились — ветка не нужна."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add tests/e2e/__screenshots__
          git commit             -m "ci: линуксовые базлайны визуальных снимков"             -m "Сняты job e2e-visual-baseline на ubuntu-latest. Проверьте картинки глазами: это эталон, а не зафиксированная регрессия. После мержа job e2e-visual включится сам и начнёт блокировать визуальные расхождения."
          git push -f origin "$BRANCH"
          echo "::notice::Базлайны в ветке $BRANCH — откройте PR и просмотрите картинки."
