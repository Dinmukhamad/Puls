name: checks

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: puls
          POSTGRES_PASSWORD: puls
          POSTGRES_DB: puls
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U puls -d puls"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints.txt -r requirements.txt -r requirements-dev.txt
      - name: Dependency audit
        run: pip-audit -r requirements.txt
      - name: PostgreSQL migration smoke test
        env:
          DATABASE_URL: postgresql://puls:puls@localhost:5432/puls
        run: |
          alembic upgrade head
          alembic current
      - name: Ruff
        run: ruff check app tests scripts
      - name: Compile Python
        run: python -m compileall app scripts tests
      - name: Pytest
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=69

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install Node dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Frontend tests
        run: npm test
      - name: Frontend dependency audit
        run: npm audit --audit-level=high
      # Бандлы js/app.js, js/api.js, css/styles.css закоммичены (их напрямую
      # отдаёт деплой: Dockerfile/railpack без Node). Этот шаг гарантирует,
      # что они пересобраны из js/src и css/src: если кто-то поменял исходники
      # и забыл `npm run build` (или отредактировал бандл руками) — CI упадёт.
      - name: Verify committed bundles match sources
        run: |
          CHANGED="$(git status --porcelain -- js/app.js js/api.js css/styles.css)"
          if [ -n "$CHANGED" ]; then
            echo "::error::Бандлы рассинхронизированы с исходниками js/src и css/src."
            git --no-pager diff --stat -- js/app.js js/api.js css/styles.css
            echo "Выполните локально 'npm run build' и закоммитьте обновлённые js/app.js, js/api.js, css/styles.css вместе с изменениями исходников."
            exit 1
          fi
          echo "Бандлы синхронны с исходниками."
