name: checks

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: puls
          POSTGRES_PASSWORD: puls
          POSTGRES_DB: puls
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U puls -d puls"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: PostgreSQL migration smoke test
        env:
          DATABASE_URL: postgresql://puls:puls@localhost:5432/puls
        run: |
          alembic upgrade head
          alembic current
      - name: Ruff
        run: ruff check app tests
      - name: Compile Python
        run: python -m compileall app scripts tests
      - name: Pytest
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install Node dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
