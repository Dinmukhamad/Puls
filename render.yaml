# Blueprint для Render: веб-сервис + PostgreSQL.
# Создание: Render Dashboard -> New -> Blueprint -> выбрать этот репозиторий.
#
# При первом деплое Render спросит значения переменных с `sync: false`.

databases:
  - name: gamification-db
    databaseName: gamification
    user: gamification
    plan: free
    region: frankfurt
    postgresMajorVersion: "17"

services:
  - type: web
    name: gamification-api
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    # Схема раскатывается миграциями перед запуском приложения.
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gamification-db
          property: connectionString

      # Ключ подписи JWT генерируется Render и не попадает в репозиторий.
      - key: SECRET_KEY
        generateValue: true

      # Схемой управляет Alembic, автосоздание таблиц выключено.
      - key: AUTO_CREATE_SCHEMA
        value: "false"
      # Токен @puls_i_bot добавьте вручную в Environment сервиса API.
      # Без токена обычный Puls работает, подтверждение Driver Simulator закрыто.
      - key: TELEGRAM_BOT_USERNAME
        value: puls_i_bot
      - key: TELEGRAM_WEBHOOK_URL
        value: https://gamification-api-lbtb.onrender.com/api/v1/auth/telegram/webhook
      - key: DRIVER_DEVICE_DAYS
        value: "30"
      # Справочники (показатели, номинации, бейджи, каталог) досоздаются
      # идемпотентно: уже настроенные записи не трогаются.
      - key: SEED_REFERENCE_DATA
        value: "true"

      # Встроенный планировщик работает, пока инстанс не засыпает.
      # На free-плане сервис останавливается без трафика - см. README,
      # раздел «Еженедельный расчёт на Render».
      - key: SCHEDULER_ENABLED
        value: "true"
      - key: WEEKLY_CLOSE_CRON_DAY_OF_WEEK
        value: mon
      - key: WEEKLY_CLOSE_CRON_HOUR
        value: "3"

      - key: TIMEZONE
        value: Asia/Almaty
      - key: DEBUG
        value: "false"

      # Домены фронтенда через запятую. Замените после его появления.
      - key: CORS_ORIGINS
        value: "*"

      # Учётная запись администратора создаётся при первом старте.
      - key: BOOTSTRAP_ADMIN_LOGIN
        value: admin
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false

  # Интерфейс: статическая сборка React, раздаётся с CDN и не засыпает.
  - type: web
    name: gamification-web
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    # Маршруты внутри приложения обрабатывает роутер, поэтому все пути,
    # кроме существующих файлов, отдают index.html.
    # Шаблон именно "/**": одна звёздочка покрывает лишь один сегмент пути
    # и не ловит вложенные адреса вроде /admin/operators.
    routes:
      - type: rewrite
        source: /**
        destination: /index.html
    # Имена файлов сборки содержат хеш содержимого, поэтому их можно
    # кешировать надолго. Заголовки задаются вложенным списком key/value.
    headers:
      - path: /assets/*
        headers:
          - key: Cache-Control
            value: public, max-age=31536000, immutable
    envVars:
      # Публичный адрес API. Подставить его из соседнего сервиса нельзя:
      # fromService отдаёт только внутренние имена сети Render, а этот адрес
      # исполняет браузер. Меняйте здесь, если сервис API переименован.
      - key: VITE_API_BASE_URL
        value: https://gamification-api-lbtb.onrender.com

# Еженедельный расчёт отдельным Cron Job (платная возможность Render).
# Раскомментируйте и выставьте SCHEDULER_ENABLED=false у веб-сервиса,
