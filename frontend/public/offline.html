<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F5F5F4" />
    <link rel="icon" type="image/svg+xml" href="/icons/puls-light.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon-v3.png" />
    <title>Puls — нет соединения</title>
    <style>
      :root { color-scheme: light; --bg: #f5f5f4; --surface: #fff; --text: #111214; --secondary: #686a70; }
      @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { color-scheme: dark; --bg: #0b0c0e; --surface: #141518; --text: #f6f7f9; --secondary: #a7acb7; } }
      :root[data-theme="dark"] { color-scheme: dark; --bg: #0b0c0e; --surface: #141518; --text: #f6f7f9; --secondary: #a7acb7; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom)); background: var(--bg); color: var(--text); font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
      main { width: min(100%, 440px); padding: 32px; border-radius: 24px; background: var(--surface); }
      .brand { color: #e8431f; font-weight: 700; }
      h1 { margin: 20px 0 12px; font-size: 32px; line-height: 1.15; }
      p { color: var(--secondary); }
      button { min-height: 50px; width: 100%; padding: 12px 20px; margin-top: 16px; border: 0; border-radius: 16px; background: #17191e; color: white; font: inherit; font-weight: 600; cursor: pointer; }
      button:focus-visible { outline: 2px solid #f0522e; outline-offset: 4px; }
    </style>
    <script>
      try { var theme = localStorage.getItem("puls.theme"); if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme; } catch (_) {}
    </script>
  </head>
  <body>
    <main>
      <img src="/icons/puls-app-192-v3.png" width="56" height="56" alt="Puls" />
      <h1>Нет соединения</h1>
      <p id="status" role="status">Для загрузки кабинета нужен интернет. Проверьте Wi-Fi или мобильную сеть.</p>
      <button type="button" onclick="location.reload()">Повторить</button>
    </main>
    <script>
      window.addEventListener("online", function () { document.getElementById("status").textContent = "Сеть доступна. Нажмите «Повторить», чтобы вернуться в Puls."; });
      window.addEventListener("offline", function () { document.getElementById("status").textContent = "Соединение потеряно. Проверьте Wi-Fi или мобильную сеть."; });
    </script>
  </body>
</html>
